
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo React</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Photo React</h1>
    <p>Compartilhe seus momentos.</p>
  </header>

  <main>
    <section class="create">
      <h2>Nova publicação</h2>
      <input type="text" id="username" placeholder="Seu nome">
      <input type="text" id="photo" placeholder="URL da imagem">
      <textarea id="caption" placeholder="Escreva uma legenda..."></textarea>
      <button onclick="publish()">Publicar</button>
    </section>

    <section>
      <h2>Feed</h2>
      <div id="feed"></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
